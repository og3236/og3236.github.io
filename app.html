    function initSelectors() {
      const selIn = document.getElementById("tokenIn");
      const selOut = document.getElementById("tokenOut");
      ASSETS.forEach((a, idx) => {
        selIn.add(new Option(a.name, idx));
        if (a.chain === "0x89") selOut.add(new Option(a.name, idx));
      });
      selIn.value = "0";
      selOut.value = "1";
      getQuote();

    function formatPTBR(hexVal, dec, fixed) {
      if (!hexVal || hexVal === "0x") return (0).toFixed(fixed).replace(".", ",");
      const raw = BigInt(hexVal);
      const div = BigInt(10) ** BigInt(dec);
      const whole = (raw / div).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const frac = (raw % div).toString().padStart(dec, "0").slice(0, fixed);
      return whole + "," + frac;
    }

    function toWeiStr(amountStr, dec) {
      const clean = String(amountStr).replace(",", ".");
      const parts = clean.split(".");
      const whole = parts.at(0) || "0";
      const frac = (parts.at(1) || "").padEnd(dec, "0").slice(0, dec);
      return (BigInt(whole) * (BigInt(10) ** BigInt(dec)) + BigInt(frac)).toString();
    }

    function toWeiHex(amountStr, dec) {
      return "0x" + BigInt(toWeiStr(amountStr, dec)).toString(16);
    }

    async function connectWallet() {
      const st = document.getElementById("statusMsg");
      st.textContent = "";
      if (!window.ethereum) {
        st.textContent = "Abra este link dentro do navegador da Rabby Wallet.";
        return;
      }
      try {
        const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
        if (!accs || !accs.length) {
          st.textContent = "Nenhuma conta autorizada na carteira.";
          return;
        }
        userAccount = accs.at(0);
        const chainId = await window.ethereum.request({ method: "eth_chainId" });
        if (chainId !== "0x89") {
          try {
            await window.ethereum.request({
              method: "wallet_switchEthereumChain",
              params: [{ chainId: "0x89" }]
            });
          } catch (switchErr) {
            if (switchErr.code === 4902) {
              await window.ethereum.request({
                method: "wallet_addEthereumChain",
                params: [{
                  chainId: "0x89",
                  chainName: "Polygon Mainnet",
                  nativeCurrency: { name: "POL", symbol: "POL", decimals: 18 },
                  rpcUrls: ["https://polygon-rpc.com"],
                  blockExplorerUrls: ["https://polygonscan.com"]
                }]
              });
            } else {
              throw switchErr;
            }
          }
        }
        document.getElementById("btnConnect").textContent = "Carteira Conectada";
        const box = document.getElementById("walletAddr");
        box.style.display = "block";
        box.textContent = userAccount.slice(0, 6) + "..." + userAccount.slice(-4);
        await loadBalances();
      } catch (e) {
        st.textContent = "Erro ao conectar: " + (e.message || "conexão recusada.");
      }
    }

    async function loadBalances() {
      if (!userAccount) return;
      try {
        const polHex = await window.ethereum.request({
          method: "eth_getBalance",
          params: [userAccount, "latest"]
        });
        document.getElementById("bal-POL").textContent = formatPTBR(polHex, 18, 4);
      } catch (e) {}

      const clean = userAccount.toLowerCase().replace("0x", "").padStart(64, "0");
      for (const a of ASSETS) {
        if (!a.balId || a.sym === "POL") continue;
        try {
          const res = await window.ethereum.request({
            method: "eth_call",
            params: [{ to: a.addr, data: "0x70a08231" + clean }, "latest"]
          });
          document.getElementById(a.balId).textContent = formatPTBR(res, a.dec, a.fixed);
        } catch (e) {}
      }
    }

    function handleTokenChange() {
      const aIn = ASSETS.at(Number(document.getElementById("tokenIn").value));
      const qBox = document.getElementById("quoteBox");
      const btn = document.getElementById("btnSwap");
      if (aIn.chain !== "0x89") {
        document.getElementById("amountOut").value = "Ponte Cross-Chain";
        qBox.textContent = "Ativo fora da Polygon. Use uma ponte cross-chain para trazer para a rede Polygon.";
        btn.disabled = true;
        return;
      }
      btn.disabled = false;
      debounceQuote();
    }

    function invertTokens() {
      const selIn = document.getElementById("tokenIn");
      const selOut = document.getElementById("tokenOut");
      const aIn = ASSETS.at(Number(selIn.value));
      if (aIn.chain !== "0x89") return;
      const tmp = selIn.value;
      selIn.value = selOut.value;
      selOut.value = tmp;
      debounceQuote();
    }

    function debounceQuote() {
      clearTimeout(quoteTimer);
      quoteTimer = setTimeout(getQuote, 450);
    }async function getQuote() {
      const aIn = ASSETS.at(Number(document.getElementById("tokenIn").value));
      const aOut = ASSETS.at(Number(document.getElementById("tokenOut").value));
      const val = parseFloat(document.getElementById("amountIn").value);
      const qBox = document.getElementById("quoteBox");
      const outInput = document.getElementById("amountOut");
      const btn = document.getElementById("btnSwap");

      useUniswapFallback = false;
      btn.textContent = "Buscar Cotação / Converter";

      if (aIn.chain !== "0x89") return;
      if (!val || val <= 0) {
        outInput.value = "0.00";
        qBox.textContent = "Digite um valor maior que zero.";
        currentRouteSummary = null;
        return;
      }
      if (aIn.sym === aOut.sym) {
        outInput.value = val.toString();
        qBox.textContent = "Selecione moedas diferentes para converter.";
        currentRouteSummary = null;
        return;
      }

      qBox.textContent = "Buscando melhor rota na Polygon...";
      try {
        const amountWei = toWeiStr(val.toString(), aIn.dec);
        const url = `https://kyberswap.com{aIn.addr}&tokenOut=${aOut.addr}&amountIn=${amountWei}`;
        const resp = await fetch(url, {
          headers: { "x-client-id": "harpija-pay-web3" }
        });
        const json = await resp.json();

        if (!json.data || !json.data.routeSummary) {
          currentRouteSummary = null;
          if (aIn.sym === "HTO" || aOut.sym === "HTO" || aIn.sym === "JHT" || aOut.sym === "JHT") {
            outInput.value = "Pool V4";
            qBox.textContent = "Pool oficial ativa na Uniswap V4. Toque abaixo para converter direto na Uniswap.";
            btn.textContent = "Converter na Uniswap V4";
            useUniswapFallback = true;
          } else {
            outInput.value = "0.00";
            qBox.textContent = "Sem liquidez disponível para este par no momento.";
          }
          return;
        }

        currentRouteSummary = json.data.routeSummary;
        const outRaw = BigInt(currentRouteSummary.amountOut);
        const div = BigInt(10) ** BigInt(aOut.dec);
        const whole = (outRaw / div).toString();
        const frac = (outRaw % div).toString().padStart(aOut.dec, "0").slice(0, 6);
        outInput.value = `${whole}.${frac}`;

        const gasUsd = Number(currentRouteSummary.gasUsd || 0).toFixed(4);
        qBox.textContent = `Rota encontrada • Taxa de rede estimada: $${gasUsd}`;
      } catch (e) {
        outInput.value = "0.00";
        qBox.textContent = "Erro na API: " + (e.message || "falha de rede.");
        currentRouteSummary = null;
      }

    }async function executeSwap() {
      const st = document.getElementById("statusMsg");
      st.textContent = "";

      const aIn = ASSETS.at(Number(document.getElementById("tokenIn").value));
      const aOut = ASSETS.at(Number(document.getElementById("tokenOut").value));
      const val = document.getElementById("amountIn").value;

      if (useUniswapFallback) {
        const inParam = aIn.sym === "POL" ? "ETH" : aIn.addr;
        const outParam = aOut.sym === "POL" ? "ETH" : aOut.addr;
        const uniUrl = `https://uniswap.org{inParam}&outputCurrency=${outParam}&value=${val}`;
        window.open(uniUrl, "_blank");
        return;
      }

      if (!userAccount) {
        await connectWallet();
        if (!userAccount) return;
      }

      if (!currentRouteSummary) {
        await getQuote();
        if (useUniswapFallback) {
          executeSwap();
          return;
        }
        if (!currentRouteSummary) {
          st.textContent = "Nenhuma cotação válida disponível para trocar.";
          return;
        }
      }

      const amountWei = toWeiStr(val, aIn.dec);
      const btn = document.getElementById("btnSwap");
      btn.disabled = true;

      try {
        st.textContent = "Preparando transação na rota KyberSwap...";
        const buildResp = await fetch("https://kyberswap.com", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-client-id": "harpija-pay-web3"
          },
          body: JSON.stringify({
            routeSummary: currentRouteSummary,
            sender: userAccount,
            recipient: userAccount,
            slippageTolerance: 100
          })
        });
        const buildJson = await buildResp.json();
        if (!buildJson.data || !buildJson.data.data) {
          throw new Error("Não foi possível montar os dados do swap.");
        }const routerAddress = buildJson.data.routerAddress;

        if (aIn.sym !== "POL") {
          const cleanOwner = userAccount.toLowerCase().replace("0x", "").padStart(64, "0");
          const cleanSpender = routerAddress.toLowerCase().replace("0x", "").padStart(64, "0");
          const allowHex = await window.ethereum.request({
            method: "eth_call",
            params: [{ to: aIn.addr, data: "0xdd62ed3e" + cleanOwner + cleanSpender }, "latest"]
          });
          if (BigInt(allowHex || "0x0") < BigInt(amountWei)) {
            st.textContent = `Aprovando ${aIn.sym} na Rabby Wallet...`;
            const maxUint = "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
            const appTx = await window.ethereum.request({
              method: "eth_sendTransaction",
              params: [{
                from: userAccount,
                to: aIn.addr,
                data: "0x095ea7b3" + cleanSpender + maxUint
              }]
            });
            st.textContent = "Aguardando confirmação da aprovação...";
            await waitReceipt(appTx);
          }
        }

        st.textContent = "Confirme a conversão na Rabby Wallet...";
        const txParams = {
          from: userAccount,
          to: routerAddress,
          data: buildJson.data.data
        };
        if (aIn.sym === "POL") {
          txParams.value = toWeiHex(val, 18);
        }

        const txHash = await window.ethereum.request({
          method: "eth_sendTransaction",
          params: [txParams]
        });

        st.textContent = "Transação enviada! Aguardando confirmação...";
        await waitReceipt(txHash);
        st.textContent = "Conversão concluída com sucesso!";
        await loadBalances();
      } catch (e) {
        st.textContent = "Operação cancelada ou erro: " + (e.message || "falha na transação.");
      } finally {
        btn.disabled = false;
      }
    }

    async function waitReceipt(hash) {
      for (let i = 0; i < 40; i++) {
        const receipt = await window.ethereum.request({
          method: "eth_getTransactionReceipt",
          params: [hash]
        });
        if (receipt) return receipt;
        await new Promise(r => setTimeout(r, 2000));
      }
    }
